name: Daily Smart Mail Digest

on:
  schedule:
    # 매일 11:40 KST (UTC 02:40). 정각(:00)은 GitHub 예약 실행이 몰려 누락/지연이 잦아 피함.
    # GitHub 지연(보통 5~20분)을 감안하면 12시 전후 도착.
    - cron: '40 2 * * *'
    # [임시 테스트] 14:40 KST (UTC 05:40) - 예약 실행 동작 확인 후 삭제 예정
    - cron: '40 5 * * *'
  workflow_dispatch: # 언제든 웹/모바일에서 수동 실행 버튼으로도 즉시 실행 가능

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Mail Digest (Fetch + Filter + POSTECH AI Summarize + Discord Notify)
        env:
          TZ: Asia/Seoul
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          NAVER_POSTECH_FOLDER: ${{ secrets.NAVER_POSTECH_FOLDER || 'POSTECH_BOT' }}
          AUTO_CLEAN_POSTECH_FOLDER: 'true'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: 'https://genai.postech.ac.kr/agent/api/a3/claude'
          AI_MODEL: 'claude-sonnet-4.5'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 mail_digest/run_digest.py --standalone
